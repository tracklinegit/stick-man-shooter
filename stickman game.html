<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Static Burst</title>
<style>
  html,body{margin:0;height:100%;background:#0e0b1f;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1280, H = 720; cv.width = W; cv.height = H;
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a);
const dz = v => Math.abs(v) < 0.18 ? 0 : v;
const FONT = "'Trebuchet MS', 'Century Gothic', system-ui, sans-serif";

// ---------- input ----------
const keys = {}, mouse = { x: W / 2, y: H / 2, down: false };
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H);
  mouse.x = (e.clientX - r.left - (r.width - W * s) / 2) / s;
  mouse.y = (e.clientY - r.top - (r.height - H * s) / 2) / s;
});
cv.addEventListener('mousedown', () => mouse.down = true);
addEventListener('mouseup', () => mouse.down = false);
let pad = null;
const rumble = (m, ms) => pad && pad.vibrationActuator &&
  pad.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: m, weakMagnitude: m }).catch(() => {});

// ---------- game data ----------
const D = {
  drone:   { r: 14, hp: 1, sp: 110, pts: 10, c: '#ff5d8f', n: 4 },
  swarmer: { r: 9,  hp: 1, sp: 220, pts: 15, c: '#ff9d3d', n: 3 },
  brute:   { r: 26, hp: 4, sp: 65,  pts: 50, c: '#8f7bff', n: 6 }
};
let state = 'title', hi = +localStorage.getItem('static-burst-hi') || 0;
let P, bullets, enemies, parts, drops, wave, score, combo, comboT, spawnQ, spawnT, shake, banner, t = 0, overT = 0;

function reset() {
  P = { x: W / 2, y: H / 2, vx: 0, vy: 0, a: 0, lx: 1, ly: 0, hp: 3, inv: 0, fire: 0, dash: 0, dcd: 0, spread: 0 };
  bullets = []; enemies = []; parts = []; drops = [];
  wave = 0; score = 0; combo = 0; comboT = 0; shake = 0; nextWave();
}
function nextWave() {
  wave++; banner = 2; spawnQ = [];
  for (let i = 0, n = 6 + wave * 3; i < n; i++) {
    const r = Math.random();
    spawnQ.push(wave >= 3 && r > 0.88 ? 'brute' : wave >= 2 && r > 0.6 ? 'swarmer' : 'drone');
  }
  spawnT = 1.5;
}
function spawn(k) {
  const s = Math.floor(Math.random() * 4), m = 40, d = D[k]; let x, y;
  if (s === 0) { x = rnd(0, W); y = -m; } else if (s === 1) { x = W + m; y = rnd(0, H); }
  else if (s === 2) { x = rnd(0, W); y = H + m; } else { x = -m; y = rnd(0, H); }
  enemies.push({ k, x, y, r: d.r, hp: d.hp, sp: d.sp + wave * 4, ph: rnd(0, TAU), kx: 0, ky: 0, fl: 0 });
}
function burst(x, y, n, c, sp) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(sp * 0.2, sp), l = rnd(0.3, 0.7);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: l, max: l, c, s: rnd(1.5, 3.5) });
  }
}
function kill(e) {
  const d = D[e.k];
  combo++; comboT = 2;
  score += d.pts * (1 + Math.min(4, Math.floor(combo / 8)));
  burst(e.x, e.y, 12 + e.r / 2, d.c, 260);
  shake = Math.max(shake, e.k === 'brute' ? 10 : 3);
  if (e.k === 'brute') rumble(0.5, 120);
  if (Math.random() < 0.06) drops.push({ x: e.x, y: e.y, k: Math.random() < 0.5 ? 'spread' : 'heart', life: 8 });
}
function hurt() {
  P.hp--; P.inv = 1.5; shake = 14; combo = 0;
  burst(P.x, P.y, 24, '#f4e04d', 320); rumble(0.8, 300);
  for (const e of enemies) {
    const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1;
    if (d < 180) { e.kx += dx / d * 600; e.ky += dy / d * 600; }
  }
  if (P.hp <= 0) {
    state = 'over'; overT = 0;
    if (score > hi) { hi = score; try { localStorage.setItem('static-burst-hi', hi); } catch (e) {} }
  }
}

// ---------- update ----------
function update(dt) {
  // read controls
  let mx = 0, my = 0, ax = 0, ay = 0, fire = false, dash = false;
  if (pad) {
    const b = i => pad.buttons[i] && pad.buttons[i].pressed;
    mx = dz(pad.axes[0]); my = dz(pad.axes[1]); ax = dz(pad.axes[2]); ay = dz(pad.axes[3]);
    dash = b(0) || b(4) || b(5) || b(6);
    fire = Math.hypot(ax, ay) > 0.3 || b(7);
    if (Math.hypot(ax, ay) > 0.3) P.a = Math.atan2(ay, ax);
  } else {
    P.a = Math.atan2(mouse.y - P.y, mouse.x - P.x);
    fire = mouse.down;
  }
  mx += (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  my += (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (keys.Space) dash = true;
  if (keys.KeyJ) fire = true;
  const ml = Math.hypot(mx, my);
  if (ml > 1) { mx /= ml; my /= ml; }
  if (ml > 0.1) { P.lx = mx; P.ly = my; }

  // dash + movement
  P.dcd -= dt; P.inv -= dt; P.spread -= dt; P.fire -= dt;
  if (dash && P.dcd <= 0) {
    const l = Math.hypot(P.lx, P.ly) || 1;
    P.dash = 0.15; P.dcd = 1; P.inv = Math.max(P.inv, 0.3);
    P.vx = P.lx / l * 900; P.vy = P.ly / l * 900;
    burst(P.x, P.y, 10, '#f4e04d', 180); rumble(0.2, 80);
  }
  if (P.dash > 0) { P.dash -= dt; }
  else { P.vx = mx * 330; P.vy = my * 330; }
  P.x = Math.max(16, Math.min(W - 16, P.x + P.vx * dt));
  P.y = Math.max(16, Math.min(H - 16, P.y + P.vy * dt));

  // shooting
  if (fire && P.fire <= 0) {
    P.fire = 0.12;
    const angles = P.spread > 0 ? [-0.2, 0, 0.2] : [0];
    for (const o of angles) {
      const a = P.a + o + rnd(-0.03, 0.03);
      bullets.push({ x: P.x + Math.cos(a) * 18, y: P.y + Math.sin(a) * 18, vx: Math.cos(a) * 850, vy: Math.sin(a) * 850, life: 0.8 });
    }
    rumble(0.1, 30);
  }
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }

  // spawning and waves
  spawnT -= dt; banner -= dt;
  if (spawnQ.length && spawnT <= 0) { spawn(spawnQ.pop()); spawnT = Math.max(0.25, 0.9 - wave * 0.05); }
  else if (!spawnQ.length && !enemies.length) { nextWave(); }

  // enemies
  const decay = Math.exp(-8 * dt);
  for (const e of enemies) {
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    let ux = dx / d, uy = dy / d;
    if (e.k === 'swarmer') { const w = Math.sin(t * 5 + e.ph) * 0.8; const tx = -uy * w, ty = ux * w; ux += tx; uy += ty; }
    e.x += (ux * e.sp + e.kx) * dt; e.y += (uy * e.sp + e.ky) * dt;
    e.kx *= decay; e.ky *= decay; e.fl = Math.max(0, e.fl - dt);
  }
  // bullets vs enemies
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.hp > 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
        b.life = 0; e.hp--; e.fl = 0.08; e.kx += b.vx * 0.25; e.ky += b.vy * 0.25;
        burst(b.x, b.y, 3, D[e.k].c, 120);
        if (e.hp <= 0) kill(e);
        break;
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  enemies = enemies.filter(e => e.hp > 0);
  // enemies vs player
  if (P.inv <= 0) for (const e of enemies) if (Math.hypot(P.x - e.x, P.y - e.y) < e.r + 12) { hurt(); break; }
  // drops
  for (const d of drops) {
    d.life -= dt;
    if (Math.hypot(P.x - d.x, P.y - d.y) < 26) {
      d.life = 0;
      if (d.k === 'spread') P.spread = 8; else P.hp = Math.min(5, P.hp + 1);
      burst(d.x, d.y, 14, d.k === 'spread' ? '#7be0ff' : '#ff5d8f', 220);
    }
  }
  drops = drops.filter(d => d.life > 0);
  // misc
  comboT -= dt; if (comboT <= 0) combo = 0;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
}

// ---------- drawing ----------
function poly(x, y, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * TAU;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function text(s, x, y, size, color, align = 'center') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function drawWorld() {
  ctx.strokeStyle = '#1d1840'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += 64) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 64) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  for (const d of drops) {
    const c = d.k === 'spread' ? '#7be0ff' : '#ff5d8f';
    ctx.globalAlpha = d.life < 2 ? 0.4 + 0.6 * Math.abs(Math.sin(t * 12)) : 1;
    ctx.strokeStyle = c; ctx.lineWidth = 3; poly(d.x, d.y, 13, d.k === 'spread' ? 3 : 4, t * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (const p of parts) {
    ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#fff6a8'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
  for (const b of bullets) { ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.02, b.y - b.vy * 0.02); }
  ctx.stroke();

  for (const e of enemies) {
    const d = D[e.k], rot = e.k === 'swarmer' ? Math.atan2(P.y - e.y, P.x - e.x) : t * (e.k === 'brute' ? 0.8 : 2);
    ctx.fillStyle = e.fl > 0 ? '#ffffff' : d.c; poly(e.x, e.y, e.r, d.n, rot); ctx.fill();
    if (e.k === 'brute' && e.hp > 0) { ctx.fillStyle = '#0e0b1f'; poly(e.x, e.y, e.r * 0.45 * e.hp / 4 + 3, 6, rot); ctx.fill(); }
  }

  if (state !== 'over' && !(P.inv > 0 && Math.floor(t * 20) % 2)) {
    ctx.strokeStyle = 'rgba(244,224,77,.18)'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(P.x + Math.cos(P.a) * 24, P.y + Math.sin(P.a) * 24);
    ctx.lineTo(P.x + Math.cos(P.a) * 90, P.y + Math.sin(P.a) * 90); ctx.stroke();
    ctx.fillStyle = P.spread > 0 ? '#7be0ff' : '#f4e04d';
    ctx.beginPath();
    ctx.moveTo(P.x + Math.cos(P.a) * 18, P.y + Math.sin(P.a) * 18);
    ctx.lineTo(P.x + Math.cos(P.a + 2.5) * 14, P.y + Math.sin(P.a + 2.5) * 14);
    ctx.lineTo(P.x + Math.cos(P.a + Math.PI) * 6, P.y + Math.sin(P.a + Math.PI) * 6);
    ctx.lineTo(P.x + Math.cos(P.a - 2.5) * 14, P.y + Math.sin(P.a - 2.5) * 14);
    ctx.closePath(); ctx.fill();
    if (P.dcd > 0) {
      ctx.strokeStyle = 'rgba(244,224,77,.35)'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.arc(P.x, P.y, 26, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - P.dcd)); ctx.stroke();
    }
  }
}
function drawHUD() {
  text(String(score), 24, 44, 30, '#e9e4ff', 'left');
  text('Best ' + hi, 24, 70, 16, '#8a82b8', 'left');
  text('Wave ' + wave, W / 2, 38, 20, '#8a82b8');
  if (combo >= 8) text('x' + (1 + Math.min(4, Math.floor(combo / 8))), W / 2, 66, 22, '#f4e04d');
  for (let i = 0; i < P.hp; i++) { ctx.fillStyle = '#ff5d8f'; poly(W - 30 - i * 28, 36, 9, 4, Math.PI / 4); ctx.fill(); }
  if (P.spread > 0) text('Spread ' + Math.ceil(P.spread), W - 24, 70, 16, '#7be0ff', 'right');
  if (banner > 0 && state === 'play') {
    ctx.globalAlpha = Math.min(1, banner); text('Wave ' + wave, W / 2, H / 2 - 120, 54, '#e9e4ff'); ctx.globalAlpha = 1;
  }
}
function draw() {
  ctx.fillStyle = '#0e0b1f'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.3) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  if (P) drawWorld();
  ctx.restore();
  if (state === 'title') {
    text('Static Burst', W / 2, H / 2 - 40, 84, '#f4e04d');
    text('Press A, Space or click to start', W / 2, H / 2 + 20, 26, '#e9e4ff');
    text('Controller: left stick moves, right stick aims and fires, A / bumpers dash', W / 2, H / 2 + 80, 18, '#8a82b8');
    text('Keyboard: WASD moves, mouse aims, click fires, Space dashes, P pauses', W / 2, H / 2 + 108, 18, '#8a82b8');
    text('Best ' + hi, W / 2, H / 2 + 160, 18, '#8a82b8');
  } else {
    drawHUD();
    if (state === 'pause') { ctx.fillStyle = 'rgba(14,11,31,.7)'; ctx.fillRect(0, 0, W, H); text('Paused', W / 2, H / 2, 60, '#e9e4ff'); }
    if (state === 'over') {
      ctx.fillStyle = 'rgba(14,11,31,.75)'; ctx.fillRect(0, 0, W, H);
      text('Game over', W / 2, H / 2 - 50, 72, '#ff5d8f');
      text('Score ' + score + '  |  Wave ' + wave, W / 2, H / 2 + 10, 28, '#e9e4ff');
      if (score >= hi && score > 0) text('New best', W / 2, H / 2 + 46, 20, '#f4e04d');
      if (overT > 0.8) text('Press A, Space or click to retry', W / 2, H / 2 + 100, 22, '#8a82b8');
    }
  }
}

// ---------- main loop ----------
let last = performance.now(), prevAny = false, prevPause = false;
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000); last = ts; t += dt;
  try { pad = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(p => p && p.connected) || null; }
  catch (err) { pad = null; }
  const anyNow = !!(keys.Space || keys.Enter || mouse.down || (pad && pad.buttons.some(b => b.pressed)));
  const edge = anyNow && !prevAny; prevAny = anyNow;
  const pauseNow = !!(keys.Escape || keys.KeyP || (pad && pad.buttons[9] && pad.buttons[9].pressed));
  const pEdge = pauseNow && !prevPause; prevPause = pauseNow;

  shake *= Math.exp(-10 * dt);
  if (state === 'title') { if (edge) { reset(); state = 'play'; } }
  else if (state === 'over') { overT += dt; if (edge && overT > 0.8) { reset(); state = 'play'; } }
  else if (state === 'play') { if (pEdge) state = 'pause'; else update(dt); }
  else if (state === 'pause') { if (pEdge) state = 'play'; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
