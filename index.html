<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Static Burst</title>
<style>
  html,body{margin:0;height:100%;background:#0e0b1f;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1280,H=720;cv.width=W;cv.height=H;
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),hyp=Math.hypot,dz=v=>Math.abs(v)<.18?0:v;
const FONT="'Trebuchet MS','Century Gothic',system-ui,sans-serif";
const ls={g:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const keys={},mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{keys[e.code]=true;initAudio();if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);mouse.x=(e.clientX-r.left-(r.width-W*s)/2)/s;mouse.y=(e.clientY-r.top-(r.height-H*s)/2)/s});
cv.addEventListener('mousedown',()=>{mouse.down=true;initAudio()});addEventListener('mouseup',()=>mouse.down=false);
const fs=()=>{try{document.fullscreenElement?document.exitFullscreen():cv.requestFullscreen()}catch(e){}};
cv.addEventListener('dblclick',fs);
const pv={};const ed=(k,c)=>{const r=!!c&&!pv[k];pv[k]=!!c;return r};

// ---------- audio (synthesized, no files) ----------
let AC,mg,muted=false;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.25;mg.connect(AC.destination);music()}catch(e){}}
function tone(f,d,type='square',v=.3,sl=0){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(mg);o.start(n);o.stop(n+d)}
const SFX={shot:()=>tone(520,.07,'square',.08,-300),boom:()=>tone(160,.3,'sawtooth',.25,-120),hit:()=>tone(300,.05,'triangle',.1,-100),hurt:()=>tone(120,.4,'sawtooth',.4,-80),dash:()=>tone(200,.15,'sine',.3,500),big:()=>tone(80,.6,'sawtooth',.5,-50),
 pick:()=>{tone(600,.08,'square',.2);setTimeout(()=>tone(900,.12,'square',.2),70)},wave:()=>{tone(440,.1);setTimeout(()=>tone(660,.15),100)}};
const sfx=k=>SFX[k]();
function music(){const bass=[55,55,82,55,65,65,98,65];let i=0;setInterval(()=>{if(state!=='play'&&state!=='title')return;tone(bass[i%8],.26,'triangle',.25);if(en.some(e=>e.k==='boss'))tone(bass[i%8]*4,.08,'square',.06);i++},300)}

// ---------- data ----------
const D={drone:{r:14,hp:1,sp:110,pts:10,c:'#ff5d8f',n:4},swarmer:{r:9,hp:1,sp:220,pts:15,c:'#ff9d3d',n:3},brute:{r:26,hp:4,sp:65,pts:50,c:'#8f7bff',n:6},
 shooter:{r:15,hp:2,sp:90,pts:30,c:'#5be3a8',n:5},splitter:{r:22,hp:3,sp:80,pts:30,c:'#e86bff',n:8},bomber:{r:12,hp:1,sp:170,pts:25,c:'#ffd166',n:5},boss:{r:60,hp:1,sp:55,pts:1000,c:'#ff3d5a',n:10}};
const WEP={pistol:{rate:.12,n:1,sp:0,dmg:1,v:850,life:.8},shotgun:{rate:.45,n:6,sp:.5,dmg:1,v:750,life:.45},laser:{rate:.05,n:1,sp:.02,dmg:1,v:1400,life:.6,pierce:1},homing:{rate:.3,n:2,sp:.5,dmg:1,v:500,life:1.6,home:1}};
const SHIPS=[['#f4e04d',0],['#7be0ff',1000],['#ff8fd0',3000],['#8dff7b',6000],['#ffffff',10000]];
const ARENAS=[[],[[300,200,60,60],[920,200,60,60],[300,460,60,60],[920,460,60,60]],[[380,200,40,320],[860,200,40,320]],[[200,340,300,40],[780,340,300,40]],[[590,0,100,250],[590,470,100,250]]];
const UPG=[['Rapid fire','Shoot 20% faster',()=>U.rate*=.8],['Heavy rounds','Bullets deal +1 damage',()=>U.dmg++],['Quick dash','Dash recharges faster',()=>U.dcd*=.75],['Fleet feet','Move 10% faster',()=>U.spd*=1.1],['Extra heart','+1 max health and heal everyone',()=>{U.maxhp++;for(const p of ps)if(p.alive)p.hp=U.maxhp}]];
const DIFFS=['Easy','Normal','Hard'],unlocked=()=>SHIPS.filter(s=>hi>=s[1]);

let state='title',hi=+ls.g('sb-hi',0),shipSel=+ls.g('sb-ship',0),diff=1,t=0,overT=0,upT=0,sel=1,newShip=false,pads=[];
let ps=[],obs=[],bul=[],en=[],eb=[],parts=[],drops=[],choices=[],U={},wave=0,score=0,combo=0,comboT=0,spawnQ=[],spawnT=0,shake=0,banner=0,flash=0,slow=0;

const mk=(i,pi,col)=>({i,pi,x:W/2+i*70,y:H/2,vx:0,vy:0,a:0,lx:1,ly:0,hp:U.maxhp,alive:true,inv:0,fire:0,dash:0,dcd:0,wep:'pistol',wt:0,col});
const shipCol=o=>{const u=unlocked();return u[(shipSel+o)%u.length][0]};
function reset(){U={rate:1,dmg:1,dcd:1,spd:1,maxhp:3};const g=pads[0];ps=[mk(0,g?g.index:-1,shipCol(0))];bul=[];en=[];eb=[];parts=[];drops=[];wave=0;score=0;combo=0;comboT=0;shake=0;flash=0;slow=0;nextWave()}
function nextWave(){wave++;banner=2.2;obs=ARENAS[Math.floor((wave-1)/3)%ARENAS.length];
 for(const p of ps)if(!p.alive){p.alive=true;p.hp=1;p.inv=2;p.x=W/2;p.y=H/2}
 const pool=['drone','drone','drone'];if(wave>=2)pool.push('swarmer','swarmer');if(wave>=3)pool.push('brute','shooter');if(wave>=4)pool.push('bomber');if(wave>=5)pool.push('splitter','splitter');
 const n=Math.round((6+wave*3)*(ps.length>1?1.5:1)*[.8,1,1.25][diff]);spawnQ=[];
 for(let i=0;i<n;i++)spawnQ.push(pool[Math.floor(Math.random()*pool.length)]);
 if(wave%5===0){spawnQ=spawnQ.slice(0,8);spawnQ.push('boss')}
 spawnT=1.5;sfx('wave')}
function spawn(k,x,y){const d=D[k];
 if(x===undefined){const s=Math.floor(Math.random()*4),m=60;if(s===0){x=rnd(0,W);y=-m}else if(s===1){x=W+m;y=rnd(0,H)}else if(s===2){x=rnd(0,W);y=H+m}else{x=-m;y=rnd(0,H)}}
 const e={k,x,y,r:d.r,hp:d.hp,sp:(d.sp+wave*4)*[.85,1,1.2][diff],ph:rnd(0,TAU),kx:0,ky:0,fl:0,fc:rnd(1,2)};
 if(k==='boss'){e.hp=e.mhp=Math.round((40+wave*8)*(ps.length>1?1.6:1));e.mode=0;e.bt=3;e.sa=0;e.sp=55}
 en.push(e)}
function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(sp*.2,sp),l=rnd(.3,.7);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,c,s:rnd(1.5,3.5)})}}
const ebul=(x,y,a,s)=>eb.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:5});
const inObs=(x,y)=>obs.some(o=>x>o[0]&&x<o[0]+o[2]&&y>o[1]&&y<o[1]+o[3]);
function push(o,r){for(const q of obs){const cx=Math.max(q[0],Math.min(o.x,q[0]+q[2])),cy=Math.max(q[1],Math.min(o.y,q[1]+q[3]));let dx=o.x-cx,dy=o.y-cy,d=hyp(dx,dy);if(d<r){if(!d){dx=1;dy=0;d=1}o.x=cx+dx/d*r;o.y=cy+dy/d*r}}}
function near(o){let b=null,m=1e9;for(const p of ps)if(p.alive){const d=hyp(p.x-o.x,p.y-o.y);if(d<m){m=d;b=p}}return b||ps[0]}
function rum(p,m,ms){try{const g=p.pi>=0&&pads.find(q=>q.index===p.pi);if(g&&g.vibrationActuator)g.vibrationActuator.playEffect('dual-rumble',{duration:ms,strongMagnitude:m,weakMagnitude:m}).catch(()=>{})}catch(e){}}
const rumAll=(m,ms)=>ps.forEach(p=>rum(p,m,ms));
function boom(x,y){burst(x,y,30,'#ffd166',380);sfx('boom');shake=Math.max(shake,8);
 for(const e of en)if(e.hp>0&&hyp(e.x-x,e.y-y)<90){e.hp-=3;if(e.hp<=0)kill(e)}
 for(const p of ps)if(p.alive&&hyp(p.x-x,p.y-y)<90)hurt(p)}
function dropAt(x,y){drops.push(Math.random()<.4?{x,y,k:'heart',life:8}:{x,y,k:'wep',w:['shotgun','laser','homing'][Math.floor(Math.random()*3)],life:8})}
function kill(e){const d=D[e.k];combo++;comboT=2;score+=d.pts*(1+Math.min(4,Math.floor(combo/8)));burst(e.x,e.y,12+e.r/2,d.c,260);sfx(e.r>20?'big':'boom');
 if(e.r>=20){shake=Math.max(shake,e.k==='boss'?24:10);slow=e.k==='boss'?.6:.12;flash=e.k==='boss'?1:.4;rumAll(.6,150)}else shake=Math.max(shake,3);
 if(e.k==='splitter'){spawn('swarmer',e.x-14,e.y);spawn('swarmer',e.x+14,e.y)}
 if(e.k==='bomber')boom(e.x,e.y);
 if(e.k==='boss'){eb=[];dropAt(e.x-30,e.y);dropAt(e.x+30,e.y);drops.push({x:e.x,y:e.y+30,k:'heart',life:10})}else if(Math.random()<.07)dropAt(e.x,e.y)}
function hurt(p){if(!p.alive||p.inv>0)return;p.hp--;p.inv=1.5;shake=14;combo=0;burst(p.x,p.y,24,p.col,320);rum(p,.8,300);sfx('hurt');
 for(const e of en){if(e.r>=40)continue;const dx=e.x-p.x,dy=e.y-p.y,d=hyp(dx,dy)||1;if(d<180){e.kx+=dx/d*600;e.ky+=dy/d*600}}
 if(p.hp<=0){p.alive=false;burst(p.x,p.y,40,p.col,400);
  if(!ps.some(q=>q.alive)){state='over';overT=0;const b=unlocked().length;if(score>hi){hi=score;ls.s('sb-hi',hi)}newShip=unlocked().length>b}}}

// ---------- input ----------
function navIn(){const a=f=>pads.some(f),b=(g,i)=>g.buttons[i]&&g.buttons[i].pressed;
 return{l:ed('l',keys.ArrowLeft||keys.KeyA||a(g=>g.axes[0]<-.6||b(g,14))),r:ed('r',keys.ArrowRight||keys.KeyD||a(g=>g.axes[0]>.6||b(g,15))),
  u:ed('u',keys.ArrowUp||keys.KeyW||a(g=>g.axes[1]<-.6||b(g,12))),d:ed('d',keys.ArrowDown||keys.KeyS||a(g=>g.axes[1]>.6||b(g,13))),
  ok:ed('ok',keys.Space||keys.Enter||a(g=>b(g,0)||b(g,9))),click:ed('click',mouse.down)}}
function ctl(p){let mx=0,my=0,fire=false,dash=false;const g=p.pi>=0?pads.find(q=>q.index===p.pi):null;
 if(g){const b=i=>g.buttons[i]&&g.buttons[i].pressed,ax=dz(g.axes[2]),ay=dz(g.axes[3]);mx=dz(g.axes[0]);my=dz(g.axes[1]);dash=b(0)||b(4)||b(5)||b(6);fire=hyp(ax,ay)>.3||b(7);if(hyp(ax,ay)>.3)p.a=Math.atan2(ay,ax)}
 else if(p.pi===-1){p.a=Math.atan2(mouse.y-p.y,mouse.x-p.x);fire=mouse.down||keys.KeyJ;dash=keys.Space;mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)}
 return{mx,my,fire,dash}}
function joinCheck(){if(ps.length>1||!ps.length)return;for(const g of pads){if(!g.buttons.some(b=>b.pressed))continue;if(ps[0].pi===-1){ps[0].pi=g.index;return}if(g.index!==ps[0].pi){ps.push(mk(1,g.index,shipCol(1)));sfx('pick');return}}}

// ---------- boss ----------
function ring(e,o){for(let i=0;i<22;i++)ebul(e.x,e.y,o+i*TAU/22,230);sfx('big')}
function bossAI(e,dt){e.bt-=dt;
 if(e.mode===0){e.sa+=dt*2;e.fc-=dt;if(e.fc<=0){e.fc=.1;for(let i=0;i<3;i++)ebul(e.x,e.y,e.sa+i*TAU/3,250)}if(e.bt<=0){e.mode=1;e.bt=1.2;ring(e,0)}}
 else if(e.mode===1){if(e.bt<=0){ring(e,.14);e.mode=2;e.bt=.9;const q=near(e),d=hyp(q.x-e.x,q.y-e.y)||1;e.kx=(q.x-e.x)/d*1500;e.ky=(q.y-e.y)/d*1500}}
 else if(e.bt<=0){e.mode=0;e.bt=3.5}}

// ---------- update ----------
function update(dt){
 joinCheck();banner-=dt;spawnT-=dt;
 for(const p of ps){if(!p.alive)continue;const c=ctl(p);let mx=c.mx,my=c.my;const ml=hyp(mx,my);if(ml>1){mx/=ml;my/=ml}if(ml>.1){p.lx=mx;p.ly=my}
  p.dcd-=dt;p.inv-=dt;p.fire-=dt;if(p.wt>0&&(p.wt-=dt)<=0)p.wep='pistol';
  if(c.dash&&p.dcd<=0){const l=hyp(p.lx,p.ly)||1;p.dash=.15;p.dcd=U.dcd;p.inv=Math.max(p.inv,.3);p.vx=p.lx/l*900;p.vy=p.ly/l*900;burst(p.x,p.y,10,p.col,180);rum(p,.2,80);sfx('dash')}
  if(p.dash>0)p.dash-=dt;else{p.vx=mx*330*U.spd;p.vy=my*330*U.spd}
  p.x=Math.max(16,Math.min(W-16,p.x+p.vx*dt));p.y=Math.max(16,Math.min(H-16,p.y+p.vy*dt));push(p,14);
  if(c.fire&&p.fire<=0){const w=WEP[p.wep];p.fire=w.rate*U.rate;
   for(let i=0;i<w.n;i++){const a=p.a+(w.n>1?-w.sp/2+w.sp*i/(w.n-1):0)+rnd(-.03,.03);
    bul.push({x:p.x+Math.cos(a)*18,y:p.y+Math.sin(a)*18,vx:Math.cos(a)*w.v,vy:Math.sin(a)*w.v,life:w.life,dmg:w.dmg+U.dmg-1,pierce:w.pierce,home:w.home,hit:w.pierce?new Set():null})}
   sfx('shot');rum(p,.1,30)}}
 for(const b of bul){
  if(b.home){let m=1e9,tg=null;for(const e of en){const d=hyp(e.x-b.x,e.y-b.y);if(d<m){m=d;tg=e}}
   if(tg){const sp=hyp(b.vx,b.vy);let a=Math.atan2(b.vy,b.vx),da=Math.atan2(tg.y-b.y,tg.x-b.x)-a;da=Math.atan2(Math.sin(da),Math.cos(da));a+=Math.max(-5*dt,Math.min(5*dt,da));b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp}}
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(inObs(b.x,b.y))b.life=0}
 if(!spawnQ.length||spawnT>0){}else{spawn(spawnQ.pop());spawnT=Math.max(.2,(.9-wave*.04)/[.85,1,1.2][diff])}
 const decay=Math.exp(-8*dt);
 for(const e of en){const p=near(e),dx=p.x-e.x,dy=p.y-e.y,d=hyp(dx,dy)||1;let ux=dx/d,uy=dy/d;
  if(e.k==='swarmer'){const w=Math.sin(t*5+e.ph)*.8,tx=-uy*w,ty=ux*w;ux+=tx;uy+=ty}
  else if(e.k==='shooter'){if(d<240){ux=-ux;uy=-uy}else if(d<330){const px=-uy*.7,py=ux*.7;ux=px;uy=py}e.fc-=dt;if(e.fc<=0&&d<700){e.fc=1.8;ebul(e.x,e.y,Math.atan2(dy,dx),280)}}
  else if(e.k==='boss')bossAI(e,dt);
  e.x+=(ux*e.sp+e.kx)*dt;e.y+=(uy*e.sp+e.ky)*dt;e.kx*=decay;e.ky*=decay;e.fl=Math.max(0,e.fl-dt);push(e,e.r)}
 for(const b of bul)for(const e of en){if(e.hp<=0||(b.pierce&&b.hit.has(e)))continue;
  if(hyp(b.x-e.x,b.y-e.y)<e.r+4){if(b.pierce)b.hit.add(e);else b.life=0;e.hp-=b.dmg;e.fl=.08;if(e.r<40){e.kx+=b.vx*.2;e.ky+=b.vy*.2}burst(b.x,b.y,3,D[e.k].c,120);sfx('hit');if(e.hp<=0)kill(e);if(!b.pierce)break}}
 for(const q of eb){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(inObs(q.x,q.y))q.life=0;for(const p of ps)if(p.alive&&p.inv<=0&&hyp(p.x-q.x,p.y-q.y)<16){q.life=0;hurt(p);break}}
 bul=bul.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);eb=eb.filter(q=>q.life>0&&q.x>-30&&q.x<W+30&&q.y>-30&&q.y<H+30);
 for(const p of ps)if(p.alive&&p.inv<=0)for(const e of en)if(e.hp>0&&hyp(p.x-e.x,p.y-e.y)<e.r+12){hurt(p);if(e.k==='bomber'){e.hp=0;boom(e.x,e.y)}break}
 en=en.filter(e=>e.hp>0);
 for(const d of drops){d.life-=dt;for(const p of ps)if(p.alive&&d.life>0&&hyp(p.x-d.x,p.y-d.y)<28){d.life=0;if(d.k==='heart')p.hp=Math.min(U.maxhp,p.hp+1);else{p.wep=d.w;p.wt=12}burst(d.x,d.y,14,d.k==='heart'?'#ff5d8f':'#7be0ff',220);sfx('pick')}}
 drops=drops.filter(d=>d.life>0);
 comboT-=dt;if(comboT<=0)combo=0;
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt}parts=parts.filter(p=>p.life>0);
 if(state==='play'&&!spawnQ.length&&!en.length){score+=wave*50;state='upgrade';upT=0;sel=1;eb=[];choices=[0,1,2,3,4].sort(()=>Math.random()-.5).slice(0,3);sfx('wave')}}

// ---------- drawing ----------
function poly(x,y,r,n,rot){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i/n*TAU;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath()}
function text(s,x,y,size,color,al='center'){ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign=al;ctx.fillStyle=color;ctx.fillText(s,x,y)}
function drawShip(x,y,a,col,s=1){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*18*s,y+Math.sin(a)*18*s);ctx.lineTo(x+Math.cos(a+2.5)*14*s,y+Math.sin(a+2.5)*14*s);ctx.lineTo(x+Math.cos(a+Math.PI)*6*s,y+Math.sin(a+Math.PI)*6*s);ctx.lineTo(x+Math.cos(a-2.5)*14*s,y+Math.sin(a-2.5)*14*s);ctx.closePath();ctx.fill()}
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b}
function drawWorld(){
 ctx.strokeStyle='#1d1840';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=W;x+=64){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<=H;y+=64){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
 ctx.fillStyle='#1a1540';ctx.strokeStyle='#4a3f8f';ctx.lineWidth=2;for(const o of obs){ctx.fillRect(o[0],o[1],o[2],o[3]);ctx.strokeRect(o[0],o[1],o[2],o[3])}
 for(const d of drops){const c=d.k==='heart'?'#ff5d8f':'#7be0ff';ctx.globalAlpha=d.life<2?.4+.6*Math.abs(Math.sin(t*12)):1;ctx.strokeStyle=c;ctx.lineWidth=3;poly(d.x,d.y,13,d.k==='heart'?4:3,t*2);ctx.stroke();ctx.globalAlpha=1;if(d.k==='wep')text(d.w[0].toUpperCase(),d.x,d.y+5,13,c)}
 for(const p of parts){ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}ctx.globalAlpha=1;
 glow('#fff6a8',10);ctx.strokeStyle='#fff6a8';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();for(const b of bul){ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.02,b.y-b.vy*.02)}ctx.stroke();
 glow('#ff7a9c',8);ctx.fillStyle='#ff7a9c';for(const q of eb){ctx.beginPath();ctx.arc(q.x,q.y,5,0,TAU);ctx.fill()}glow(0,0);ctx.shadowBlur=0;
 for(const e of en){const d=D[e.k],rot=e.k==='swarmer'?Math.atan2(P0(e).y-e.y,P0(e).x-e.x):t*(e.k==='brute'||e.k==='boss'?.8:2);
  ctx.fillStyle=e.fl>0?'#fff':d.c;if(e.k==='boss')glow(d.c,20);poly(e.x,e.y,e.r,d.n,rot);ctx.fill();ctx.shadowBlur=0;
  if(e.k==='brute'||e.k==='boss'){ctx.fillStyle='#0e0b1f';poly(e.x,e.y,e.k==='boss'?e.r*.5:e.r*.45*e.hp/4+3,6,rot);ctx.fill()}
  if(e.k==='shooter'||e.k==='bomber'){ctx.fillStyle='#0e0b1f';ctx.beginPath();ctx.arc(e.x,e.y,e.r*.35,0,TAU);ctx.fill()}}
 for(const p of ps){if(!p.alive||(p.inv>0&&Math.floor(t*20)%2))continue;
  ctx.strokeStyle=p.col+'44';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+Math.cos(p.a)*24,p.y+Math.sin(p.a)*24);ctx.lineTo(p.x+Math.cos(p.a)*90,p.y+Math.sin(p.a)*90);ctx.stroke();
  glow(p.col,16);drawShip(p.x,p.y,p.a,p.col);ctx.shadowBlur=0;
  if(p.dcd>0){ctx.strokeStyle=p.col+'66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,26,-Math.PI/2,-Math.PI/2+TAU*(1-p.dcd/U.dcd));ctx.stroke()}}}
const P0=e=>near(e)||{x:W/2,y:H/2};
function drawHUD(){
 text(String(score),24,44,30,'#e9e4ff','left');text('Best '+hi,24,70,16,'#8a82b8','left');text('Wave '+wave,W/2,38,20,'#8a82b8');
 if(combo>=8)text('x'+(1+Math.min(4,Math.floor(combo/8))),W/2,66,22,'#f4e04d');
 ps.forEach((p,i)=>{const y=36+i*46;for(let h=0;h<p.hp;h++){ctx.fillStyle=p.alive?p.col:'#555';poly(W-30-h*28,y,9,4,Math.PI/4);ctx.fill()}
  if(p.wep!=='pistol')text(p.wep+' '+Math.ceil(p.wt),W-24,y+26,15,'#7be0ff','right')});
 const bs=en.find(e=>e.k==='boss');if(bs){ctx.fillStyle='#2a2252';ctx.fillRect(W/2-250,84,500,10);ctx.fillStyle='#ff3d5a';ctx.fillRect(W/2-250,84,500*Math.max(0,bs.hp)/bs.mhp,10)}
 if(banner>0&&state==='play'){ctx.globalAlpha=Math.min(1,banner);text(wave%5===0?'Boss wave '+wave:'Wave '+wave,W/2,H/2-150,54,wave%5===0?'#ff3d5a':'#e9e4ff');ctx.globalAlpha=1}
 if(muted)text('Muted',24,H-20,14,'#8a82b8','left')}
function draw(){
 ctx.fillStyle='rgba(14,11,31,.5)';ctx.fillRect(0,0,W,H);
 ctx.save();if(shake>.3)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));drawWorld();ctx.restore();
 if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.35})`;ctx.fillRect(0,0,W,H)}
 if(state==='title'){const u=unlocked(),i=shipSel%u.length,nx=SHIPS.find(s=>hi<s[1]);ctx.fillStyle='#0e0b1f';ctx.fillRect(0,0,W,H);
  text('Static Burst',W/2,190,84,u[i][0]);
  glow(u[i][0],18);drawShip(W/2,290,-Math.PI/2,u[i][0],3);ctx.shadowBlur=0;
  text('<',W/2-110,300,40,'#8a82b8');text('>',W/2+110,300,40,'#8a82b8');
  text('Difficulty: '+DIFFS[diff]+'  (up / down)',W/2,370,22,'#e9e4ff');
  text(nx?'Next ship unlocks at '+nx[1]+' points':'All ships unlocked',W/2,402,16,'#8a82b8');
  text('Press A, Space or click to start',W/2,460,28,'#e9e4ff');
  text('Controller: left stick moves, right stick aims and fires, A or bumpers dash, Start pauses',W/2,520,17,'#8a82b8');
  text('Keyboard: WASD moves, mouse aims and fires, Space dashes, P pauses',W/2,546,17,'#8a82b8');
  text('A second controller joins co-op when you press a button on it. F or double-click: fullscreen. M: mute',W/2,572,17,'#8a82b8');
  text('Best '+hi,W/2,620,18,'#8a82b8')}
 else{drawHUD();
  if(state==='pause'){ctx.fillStyle='rgba(14,11,31,.7)';ctx.fillRect(0,0,W,H);text('Paused',W/2,H/2,60,'#e9e4ff')}
  if(state==='upgrade'){ctx.fillStyle='rgba(14,11,31,.8)';ctx.fillRect(0,0,W,H);text('Wave '+wave+' cleared',W/2,150,48,'#e9e4ff');text('Pick an upgrade (left / right, then A, or click)',W/2,190,18,'#8a82b8');
   choices.forEach((c,k)=>{const x=130+k*350,y=250,on=k===sel;ctx.fillStyle=on?'#2a2252':'#1a1540';ctx.fillRect(x,y,320,240);ctx.strokeStyle=on?'#f4e04d':'#4a3f8f';ctx.lineWidth=on?4:2;ctx.strokeRect(x,y,320,240);
    text(UPG[c][0],x+160,y+100,30,on?'#f4e04d':'#e9e4ff');text(UPG[c][1],x+160,y+140,17,'#8a82b8');text(String(k+1),x+160,y+210,22,'#4a3f8f')})}
  if(state==='over'){ctx.fillStyle='rgba(14,11,31,.75)';ctx.fillRect(0,0,W,H);text('Game over',W/2,H/2-50,72,'#ff5d8f');text('Score '+score+'  |  Wave '+wave,W/2,H/2+10,28,'#e9e4ff');
   if(score>=hi&&score>0)text('New best',W/2,H/2+46,20,'#f4e04d');if(newShip)text('New ship unlocked',W/2,H/2+72,20,'#7be0ff');
   if(overT>.8)text('Press A, Space or click to retry',W/2,H/2+120,22,'#8a82b8')}}}

// ---------- main loop ----------
let last=performance.now();
function frame(ts){const dt=Math.min(.033,(ts-last)/1000);last=ts;t+=dt;
 try{pads=[...navigator.getGamepads()].filter(g=>g&&g.connected)}catch(e){pads=[]}
 const n=navIn(),pz=ed('pause',keys.Escape||keys.KeyP||pads.some(g=>g.buttons[9]&&g.buttons[9].pressed));
 if(ed('f',keys.KeyF))fs();if(ed('m',keys.KeyM))muted=!muted;
 shake*=Math.exp(-10*dt);flash=Math.max(0,flash-dt*2);
 if(state==='title'){const len=unlocked().length;
  if(n.l){shipSel=(shipSel+len-1)%len;ls.s('sb-ship',shipSel)}if(n.r){shipSel=(shipSel+1)%len;ls.s('sb-ship',shipSel)}
  if(n.u)diff=(diff+2)%3;if(n.d)diff=(diff+1)%3;
  if(n.ok||n.click){initAudio();reset();state='play'}}
 else if(state==='over'){overT+=dt;parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});parts=parts.filter(p=>p.life>0);if(overT>.8&&(n.ok||n.click)){reset();state='play'}}
 else if(state==='play'){if(pz)state='pause';else{const sc=slow>0?.3:1;slow-=dt;update(dt*sc)}}
 else if(state==='pause'){if(pz)state='play'}
 else if(state==='upgrade'){upT+=dt;if(n.l)sel=(sel+2)%3;if(n.r)sel=(sel+1)%3;let pick=-1;
  if(upT>.5){if(n.ok)pick=sel;else if(n.click){const k=Math.floor((mouse.x-130)/350);if(k>=0&&k<3&&mouse.x-130-k*350<=320)pick=k}else if(keys.Digit1)pick=0;else if(keys.Digit2)pick=1;else if(keys.Digit3)pick=2}
  if(pick>=0){UPG[choices[pick]][2]();sfx('pick');state='play';nextWave()}}
 draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
